<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1c2420;--mu:#6b756f;--ac:#1f8a5b;--ac2:#e6f4ec;--bd:#e2e6e1;--best:#c98a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1b211e;--tx:#eef2ef;--mu:#94a09a;--ac:#3fbf86;--ac2:#1d3328;--bd:#2a332e;--best:#e8b339}}
:root[data-theme="dark"]{--bg:#121614;--card:#1b211e;--tx:#eef2ef;--mu:#94a09a;--ac:#3fbf86;--ac2:#1d3328;--bd:#2a332e;--best:#e8b339}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:9px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:0 16px;font:inherit;font-weight:600}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.sug span{background:var(--ac2);color:var(--ac);padding:5px 10px;border-radius:99px;font-size:13px}
.cat{margin-top:14px}
.cat h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 6px}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.it input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:var(--ac)}
.it .n{flex:1}
.it.d .n{text-decoration:line-through;color:var(--mu)}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:0 4px}
.tot{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.tot.best{border:2px solid var(--best)}
.tot b{font-size:18px}
.tag{font-size:12px;color:var(--best);font-weight:700}
.pr{font-size:13px;color:var(--mu);white-space:nowrap}
.pr .lo{color:var(--ac);font-weight:700}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.note{font-size:12px;color:var(--mu);margin-top:14px}
</style>
</head>

function save(){try{localStorage.setItem("sl",JSON.stringify(items))}catch(e){}}
function eur(n){return n.toFixed(2).replace(".",",")+" €"}

function add(t){t=t.trim();if(!t)return;var i=info(t);items.push({n:t,c:i[0],p:i[1],d:false});save();render()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function grouped(){var g={};items.forEach(function(it,i){(g[it.c]=g[it.c]||[]).push([it,i])});return g}
function render(){
["t0","t1","t2"].forEach(function(id,i){document.getElementById(id).className=i==tab?"on":""});

else{var m=Math.min.apply(null,tot);

items.forEach(function(it){if(!it.p)return;var lo=Math.min.apply(null,it.p);
h+='<div class="it"><span class="n">'+esc(it.n)+'</span><span class="pr">'+it.p.map(function(p){return p==lo?'<span class="lo">'+eur(p)+'</span>':eur(p)}).join(' · ')+'</span></div>'});
h+='</div>';
var un=items.filter(function(i){return!i.p}).length;if(un)h+='<div class="note">'+un+' Artikel ohne Preisdaten nicht eingerechnet.</div>'}
}else{
var g2=grouped(),k2=Object.keys(g2).sort();

k2.forEach(function(c){h+='<div class="cat"><h3>'+c+'</h3>';
g2[c].forEach(function(x){h+='<label class="it'+(x[0].d?' d':'')+'"><input type="checkbox" data-c="'+x[1]+'"'+(x[0].d?' checked':'')+'><span class="n">'+esc(x[0].n)+'</span></label>'});h+='</div>'});
if(items.some(function(i){return i.d}))h+='<p><button class="btn" style="padding:10px 16px" id="cl">Erledigte entfernen</button></p>';
}
v.innerHTML=h;
var inp=document.getElementById("in");
if(inp){var go=function(){add(inp.value)};document.getElementById("ad").onclick=go;inp.onkeydown=function(e){if(e.key=="Enter")go()}}
}
v.addEventListener("click",function(e){var t=e.target;
if(t.dataset.s)add(t.dataset.s);
if(t.dataset.r){items.splice(+t.dataset.r,1);save();render()}
if(t.id=="cl"){items=items.filter(function(i){return!i.d});save();render()}});
v.addEventListener("change",function(e){var c=e.target.dataset.c;if(c!==undefined){items[+c].d=e.target.checked;save();render()}});
["t0","t1","t2"].forEach(function(id,i){document.getElementById(id).onclick=function(){tab=i;render()}});
render();
</script>
</body>
</html>
